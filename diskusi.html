// Enhanced Input Features with better UX
function initInputFeatures() {
    const emojiBtn = document.getElementById('emojiBtn');
    const attachmentBtn = document.getElementById('attachmentBtn');
    const messageInput = document.getElementById('messageInput');
    const inputArea = document.querySelector('.input-area');
    
    // Create emoji picker
    const emojiPicker = document.createElement('div');
    emojiPicker.className = 'emoji-picker';
    
    // Popular emoji categories
    const emojiCategories = {
    "にがおえ (Wajah)": ['😊', '😂', '😆', '🥹', '😅', '😳', '😢', '😭', '😠', '🥰'],
    "ジェスチャー (Gerakan Tangan)": ['🙏', '👋', '👍', '✌️', '🤞', '👏', '🤙', '🫶', '🙌', '🫰'],
    "ハート (Hati)": ['❤️', '💖', '💕', '💞', '💓', '💗', '💘', '💔', '🩷', '🫶'],
    "どうぶつ (Hewan)": ['🐶', '🐱', '🐰', '🐻', '🐼', '🐯', '🦊', '🐸', '🐤', '🐙'],
    "たべもの (Makanan)": ['🍙', '🍚', '🍜', '🍛', '🍣', '🍱', '🍡', '🍢', '🍵', '🍓'],
    "きもち (Perasaan)": ['🥺', '🤔', '😌', '😤', '🤯', '😴', '🤤', '😎', '🥳', '😬']
};
    
    // Add emojis to picker
    for (const [category, emojis] of Object.entries(emojiCategories)) {
        const title = document.createElement('div');
        title.className = 'emoji-category-title';
        title.textContent = category;
        emojiPicker.appendChild(title);
        
        emojis.forEach(emoji => {
            const emojiSpan = document.createElement('span');
            emojiSpan.textContent = emoji;
            emojiSpan.title = emoji;
            
            emojiSpan.addEventListener('click', () => {
                const cursorPos = messageInput.selectionStart;
                const textBefore = messageInput.value.substring(0, cursorPos);
                const textAfter = messageInput.value.substring(cursorPos);
                
                messageInput.value = textBefore + emoji + textAfter;
                messageInput.focus();
                messageInput.selectionStart = cursorPos + emoji.length;
                messageInput.selectionEnd = cursorPos + emoji.length;
                
                // Trigger input event for auto-resize
                const event = new Event('input', { bubbles: true });
                messageInput.dispatchEvent(event);
            });
            
            emojiPicker.appendChild(emojiSpan);
        });
    }
    
    // Add close button to emoji picker
    const emojiCloseBtn = document.createElement('button');
    emojiCloseBtn.className = 'picker-close';
    emojiCloseBtn.innerHTML = '<i class="fas fa-times"></i>';
    emojiCloseBtn.addEventListener('click', () => {
        emojiPicker.style.display = 'none';
        emojiBtn.classList.remove('active');
    });
    emojiPicker.appendChild(emojiCloseBtn);
    
    // Create attachment menu
    const attachmentMenu = document.createElement('div');
    attachmentMenu.className = 'attachment-menu';
    attachmentMenu.innerHTML = `
        <ul>
            <li><a href="buku.html"><i class="fas fa-book"></i> Buku Materi</a></li>
            <li><a href="dokumen.html"><i class="fas fa-file"></i> Dokumen</a></li>
            <li><a href="gambar.html"><i class="fas fa-image"></i> Gambar</a></li>
            <li><a href="video.html"><i class="fas fa-video"></i> Video</a></li>
        </ul>
        <button class="picker-close"><i class="fas fa-times"></i></button>
    `;
    
    // Add close button functionality
    attachmentMenu.querySelector('.picker-close').addEventListener('click', () => {
        attachmentMenu.style.display = 'none';
        attachmentBtn.classList.remove('active');
    });
    
    // Add pickers to DOM
    inputArea.appendChild(emojiPicker);
    inputArea.appendChild(attachmentMenu);
    
    // Toggle emoji picker
    emojiBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        
        // Hide attachment menu if open
        if (attachmentMenu.style.display === 'block') {
            attachmentMenu.style.display = 'none';
            attachmentBtn.classList.remove('active');
        }
        
        // Toggle emoji picker
        if (emojiPicker.style.display === 'block') {
            emojiPicker.style.display = 'none';
            emojiBtn.classList.remove('active');
        } else {
            emojiPicker.style.display = 'block';
            emojiBtn.classList.add('active');
        }
    });
    
    // Toggle attachment menu
    attachmentBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        
        // Hide emoji picker if open
        if (emojiPicker.style.display === 'block') {
            emojiPicker.style.display = 'none';
            emojiBtn.classList.remove('active');
        }
        
        // Toggle attachment menu
        if (attachmentMenu.style.display === 'block') {
            attachmentMenu.style.display = 'none';
            attachmentBtn.classList.remove('active');
        } else {
            attachmentMenu.style.display = 'block';
            attachmentBtn.classList.add('active');
        }
    });
    
    // Close pickers when clicking outside
    document.addEventListener('click', (e) => {
        if (!emojiPicker.contains(e.target) && e.target !== emojiBtn) {
            emojiPicker.style.display = 'none';
            emojiBtn.classList.remove('active');
        }
        
        if (!attachmentMenu.contains(e.target) && e.target !== attachmentBtn) {
            attachmentMenu.style.display = 'none';
            attachmentBtn.classList.remove('active');
        }
    });
    
    // Prevent propagation when clicking inside pickers
    emojiPicker.addEventListener('click', (e) => e.stopPropagation());
    attachmentMenu.addEventListener('click', (e) => e.stopPropagation());
}

// Theme toggle function
function toggleTheme() {
    const themes = ['light', 'dark', 'anime'];
    let currentTheme = themes.indexOf(document.documentElement.getAttribute('data-theme'));
    currentTheme = (currentTheme + 1) % themes.length;
    const theme = themes[currentTheme];
    document.documentElement.setAttribute('data-theme', theme);
    localStorage.setItem('theme', theme);
    updateThemeIcon(theme);
    if (theme === 'anime') addAnimeEffects();
    else removeAnimeEffects();
}

function updateThemeIcon(theme) {
    const icon = document.querySelector('.theme-toggle i');
    const icons = {
        'anime': 'fa-palette',
        'dark': 'fa-moon',
        'light': 'fa-sun'
    };
    icon.className = `fas ${icons[theme]}`;
}

function addAnimeEffects() {
    document.querySelectorAll('.anime-star').forEach(star => star.remove());
    
    for (let i = 0; i < 50; i++) {
        const star = document.createElement('div');
        star.className = 'anime-star';
        star.style.cssText = `
            position: fixed;
            left: ${Math.random() * 100}%;
            top: ${Math.random() * 100}%;
            width: ${Math.random() * 3}px;
            height: ${Math.random() * 3}px;
            background: rgba(255,107,157,${Math.random()});
            border-radius: 50%;
            animation: sparkle ${Math.random() * 3 + 1}s infinite;
            pointer-events: none;
            z-index: -1;
        `;
        document.body.appendChild(star);
    }
}

function removeAnimeEffects() {
    document.querySelectorAll('.anime-star').forEach(star => star.remove());
}

    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeIcon(savedTheme);

});

// Cache management
const SEARCH_CACHE_EXPIRY = 20 * 60 * 60 * 1000; // 20 hours in milliseconds

// Get cached search results
function getCachedSearchResults(searchTerm) {
    const cachedResults = localStorage.getItem(`search_${searchTerm}`);
    if (!cachedResults) return null;
    
    const { results, timestamp } = JSON.parse(cachedResults);
    const now = new Date().getTime();
    
    // Check if cache is expired
    if (now - timestamp > SEARCH_CACHE_EXPIRY) {
        localStorage.removeItem(`search_${searchTerm}`);
        return null;
    }
    
    return results;
}

// Store search results in cache
function cacheSearchResults(searchTerm, results) {
    const cacheData = {
        results: results,
        timestamp: new Date().getTime()
    };
    localStorage.setItem(`search_${searchTerm}`, JSON.stringify(cacheData));
}

// Setup search button with caching
function setupSearchButton() {
    const searchBtn = document.createElement('button');
    searchBtn.className = 'search-button';
    searchBtn.innerHTML = '<i class="fas fa-search"></i> Cari';

    // Insert button after search input
    memberSearch.insertAdjacentElement('afterend', searchBtn);

    searchBtn.addEventListener('click', () => {
        const searchTerm = memberSearch.value.toLowerCase().trim();

        if (searchTerm.length < 3) {
            memberList.innerHTML = '<div class="no-members">Ketik minimal 3 huruf untuk mencari</div>';
            return;
        }

        // Check cache first
        const cachedResults = getCachedSearchResults(searchTerm);
        if (cachedResults) {
            renderMemberList(cachedResults);
            return;
        }

        // Query Firestore with limit 15
        db.collection("users")
            .orderBy("username_lowercase")
            .startAt(searchTerm)
            .endAt(searchTerm + '\uf8ff')
            .limit(15)
            .get()
            .then(snapshot => {
                if (snapshot.empty) {
                    memberList.innerHTML = '<div class="no-members">Tidak ada anggota yang cocok</div>';
                    return;
                }

                const filteredMembers = snapshot.docs.map(doc => ({
                    id: doc.id,
                    ...doc.data()
                }));

                // Cache the results
                cacheSearchResults(searchTerm, filteredMembers);
                
                // Render the results
                renderMemberList(filteredMembers);
            })
            .catch(error => {
                console.error("Error searching members:", error);
                memberList.innerHTML = '<div class="no-members">Gagal mencari anggota</div>';
            });
    });

    // Enter = klik tombol
    memberSearch.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            searchBtn.click();
        }
    });
}
       
// Render member list from filtered data

        return;
    }

    });
}

// Load messages with pagination
function loadMessages() {
    if (isFirstLoad) {
        messagesDiv.innerHTML = '';
        messageIds.clear();
    }
    
    loadingOlderMessages = true;
    
    let query = db.collection("messages")
        .orderBy("timestamp", "desc")
        .limit(messagesLimit);
    
    if (lastVisibleMessage && !isFirstLoad) {
        query = query.startAfter(lastVisibleMessage);
    }
    
    query.get()
        .then(snapshot => {
            const messages = [];
            snapshot.forEach(doc => {
                if (!messageIds.has(doc.id)) {
                    messages.push({
                        data: doc.data(),
                        id: doc.id
                    });
                    messageIds.add(doc.id);
                    lastVisibleMessage = doc;
                }
            });
            
            if (isFirstLoad) {
                displayMessagesInOrder(messages.reverse());
                setupMessageListener();
                initialMessagesLoaded = true;
                scrollToBottom();
            } else {
                prependMessages(messages.reverse());
            }
            
            if (snapshot.docs.length === messagesLimit) {
                addLoadMoreButton();
            } else {
                removeLoadMoreButton();
            }
            
            loadingOlderMessages = false;
            isFirstLoad = false;
        })
        .catch(error => {
            console.error("Error loading messages:", error);
            loadingOlderMessages = false;
            Swal.fire({
                icon: 'error',
                title: 'Gagal Memuat Pesan',
                text: 'Tidak dapat memuat pesan',
                confirmButtonColor: '#6c5ce7'
            });
        });
}

// Prepend older messages to the top
function prependMessages(messages) {
    const fragment = document.createDocumentFragment();
    let firstMessageElement = messagesDiv.querySelector('.message');
    
    messages.forEach(msg => {
        const messageElement = createMessageElement(msg.data, msg.id);
        fragment.appendChild(messageElement);
        
        const messageDate = msg.data.timestamp?.toDate();
        const currentDate = messageDate ? formatMessageDate(messageDate) : null;
        
        if (currentDate && currentDate !== lastDisplayedDate) {
            const dateDiv = createDateDivider(currentDate);
            fragment.insertBefore(dateDiv, messageElement);
            lastDisplayedDate = currentDate;
        }
    });
    
    if (firstMessageElement) {
        messagesDiv.insertBefore(fragment, firstMessageElement);
    } else {
        messagesDiv.appendChild(fragment);
    }
}

// Create message element
function createMessageElement(message, messageId) {
    const messageDate = message.timestamp?.toDate();
    const messageTime = messageDate?.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) || 'baru saja';
    const isCurrentUser = message.senderEmail === auth.currentUser?.email;
    const isRiskiziochy = message.senderEmail === "riskiziochy@gmail.com";
    
    const messageDiv = document.createElement('div');
    messageDiv.className = `message ${isCurrentUser ? 'sent' : 'received'}`;
    messageDiv.setAttribute('data-message-id', messageId);
    
    if (!isCurrentUser) {
        messageDiv.innerHTML = `
            <img src="${message.avatar || 'https://i.imgur.com/6VBx3io.png'}" alt="Avatar" class="message-avatar">
        `;
    }
    
    const messageInner = document.createElement('div');
    messageInner.className = 'message-inner';
    
    const messageInfo = document.createElement('div');
    messageInfo.className = 'message-info';
    
    const senderSpan = document.createElement('span');
    senderSpan.className = 'message-sender';
    senderSpan.textContent = isCurrentUser ? 'Anda' : message.sender;
    
    if (isRiskiziochy) {
        const senseiBadge = document.createElement('span');
        senseiBadge.className = 'sensei-badge';
        senseiBadge.textContent = 'SENSEI';
        senderSpan.appendChild(document.createTextNode(' '));
        senderSpan.appendChild(senseiBadge);
    } else {
        if (message.isSensei) {
            const senseiBadge = document.createElement('span');
            senseiBadge.className = 'sensei-badge';
            senseiBadge.textContent = 'SENSEI';
            senderSpan.appendChild(document.createTextNode(' '));
            senderSpan.appendChild(senseiBadge);
        } else if (message.isAdmin) {
            const adminBadge = document.createElement('span');
            adminBadge.className = 'admin-badge';
            adminBadge.textContent = 'ADMIN';
            senderSpan.appendChild(document.createTextNode(' '));
            senderSpan.appendChild(adminBadge);
        }
    }
    
    const timeSpan = document.createElement('span');
    timeSpan.className = 'message-time';
    timeSpan.textContent = messageTime;
    
    messageInfo.appendChild(senderSpan);
    messageInfo.appendChild(timeSpan);
    
    const messageBubble = document.createElement('div');
    messageBubble.className = 'message-bubble';
    
    if (message.replyTo) {
        const replyContainer = document.createElement('div');
        replyContainer.className = 'reply-container';
        
        const replySender = document.createElement('div');
        replySender.className = 'reply-sender';
        replySender.textContent = `Membalas ${message.replyTo.sender}`;
        
        const replyContent = document.createElement('div');
        replyContent.className = 'reply-content';
        replyContent.textContent = message.replyTo.text;
        
        replyContainer.appendChild(replySender);
        replyContainer.appendChild(replyContent);
        messageBubble.appendChild(replyContainer);
    }
    
    const messageContent = document.createElement('div');
    messageContent.className = 'message-content';
    messageContent.textContent = message.text;
    
    messageBubble.appendChild(messageContent);
    messageInner.appendChild(messageInfo);
    messageInner.appendChild(messageBubble);
    messageDiv.appendChild(messageInner);
    
    messageDiv.addEventListener('click', (e) => {
        if (e.target.tagName !== 'A' && !e.target.closest('a')) {
            setReplyMessage(message, messageId);
        }
    });
    
    return messageDiv;
}

// Create date divider element
function createDateDivider(dateString) {
    const dateDiv = document.createElement('div');
    dateDiv.className = 'message-date';
    dateDiv.innerHTML = `<span>${dateString}</span>`;
    return dateDiv;
}

// Add "Load more" button at the top
function addLoadMoreButton() {
    removeLoadMoreButton();
    
    const loadMoreBtn = document.createElement('button');
    loadMoreBtn.className = 'load-more-btn';
    loadMoreBtn.innerHTML = '<i class="fas fa-chevron-up"></i> Muat Pesan Sebelumnya';
    
    loadMoreBtn.addEventListener('click', () => {
        messagesLimit += 5;
        loadMessages();
    });
    
    messagesDiv.insertBefore(loadMoreBtn, messagesDiv.firstChild);
}

function removeLoadMoreButton() {
    const existingButton = messagesDiv.querySelector('.load-more-btn');
    if (existingButton) {
        existingButton.remove();
    }
}

// Display messages in proper chronological order
function displayMessagesInOrder(messages) {
    messages.sort((a, b) => a.data.timestamp.toDate() - b.data.timestamp.toDate());
    lastDisplayedDate = null;
    
    messages.forEach(msg => {
        const messageElement = createMessageElement(msg.data, msg.id);
        
        const messageDate = msg.data.timestamp?.toDate();
        const currentDate = messageDate ? formatMessageDate(messageDate) : null;
        
        if (currentDate && currentDate !== lastDisplayedDate) {
            const dateDiv = createDateDivider(currentDate);
            messagesDiv.appendChild(dateDiv);
            lastDisplayedDate = currentDate;
        }
        
        messagesDiv.appendChild(messageElement);
    });
}

// Set up real-time listener for new messages (with duplicate prevention)
function setupMessageListener() {
    if (messageListener) messageListener();
    
    messageListener = db.collection("messages")
        .orderBy("timestamp", "desc")
        .limit(1)
        .onSnapshot(snapshot => {
            snapshot.docChanges().forEach(change => {
                if (change.type === "added" && initialMessagesLoaded && !messageIds.has(change.doc.id)) {
                    const messageElement = createMessageElement(change.doc.data(), change.doc.id);
                    messagesDiv.appendChild(messageElement);
                    messageIds.add(change.doc.id);
                    
                    // Check if we need to add a date divider for new day
                    const messageDate = change.doc.data().timestamp?.toDate();
                    const currentDate = messageDate ? formatMessageDate(messageDate) : null;
                    
                    // Get the previous message
                    const previousMessage = messagesDiv.querySelector('.message:last-child');
                    if (previousMessage) {
                        const previousMessageId = previousMessage.getAttribute('data-message-id');
                        const previousMessageDate = messageIds.has(previousMessageId) ? 
                            getMessageDate(previousMessageId) : null;
                        
                        if (currentDate && previousMessageDate && 
                            formatMessageDate(previousMessageDate) !== currentDate) {
                            const dateDiv = createDateDivider(currentDate);
                            messagesDiv.insertBefore(dateDiv, messageElement);
                        }
                    }
                    
                    scrollToBottom();
                }
            });
        });
}

// Helper function to get message date from Firestore
function getMessageDate(messageId) {
    return db.collection("messages").doc(messageId).get()
        .then(doc => doc.exists ? doc.data().timestamp?.toDate() : null);
}

    
// Format date with weekday (and show time if same day)
function formatMessageDate(date) {
    const now = new Date();
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const yesterday = new Date(today);
    yesterday.setDate(yesterday.getDate() - 1);
    
    
    // Check if the message is from today
    if (date.getDate() === now.getDate() && 
        date.getMonth() === now.getMonth() && 
        date.getFullYear() === now.getFullYear()) {
        return "kyou";
    }
    // Check if the message is from yesterday
    else if (date.getDate() === yesterday.getDate() && 
             date.getMonth() === yesterday.getMonth() && 
             date.getFullYear() === yesterday.getFullYear()) {
        return "kinou";
    }
    // Otherwise show full date
    else {
        const options = { 
            weekday: 'long',
            day: 'numeric', 
            month: 'long', 
            year: 'numeric'
        };
        return date.toLocaleDateString('id-ID', options);
    }
}

// Set reply message
function setReplyMessage(message, messageId) {
    replyingToMessage = {
        id: messageId,
        sender: message.sender,
        text: message.text
    };
    
    replyingTo.textContent = `Membalas ${message.sender}`;
    replyContent.textContent = message.text.length > 30 
        ? message.text.substring(0, 30) + '...' 
        : message.text;
    
    replyPreview.style.display = 'flex';
    messageInput.focus();
    messageInputContainer.scrollIntoView({ behavior: 'smooth' });
}

// Cancel reply
cancelReply.addEventListener('click', () => {
    replyingToMessage = null;
    replyPreview.style.display = 'none';
    messageInput.focus();
});

// Send message
function sendMessage() {
    const messageText = messageInput.value.trim();
    
    if (messageText && auth.currentUser) {
        const user = auth.currentUser;
        
        db.collection("users").doc(user.uid).get()
            .then(doc => {
                const userData = doc.data();
                
                const messageData = {
                    text: messageText,
                    sender: userData.username || user.email.split('@')[0],
                    senderEmail: user.email,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                    isAdmin: userData.isAdmin || false,
                    isSensei: userData.isSensei || false,
                    avatar: userData.avatar || 'https://i.imgur.com/6VBx3io.png'
                };
                
                if (replyingToMessage) {
                    messageData.replyTo = {
                        messageId: replyingToMessage.id,
                        sender: replyingToMessage.sender,
                        text: replyingToMessage.text
                    };
                }
                
                db.collection("messages").add(messageData)
                    .then(() => {
                        messageInput.value = '';
                        messageInput.style.height = 'auto';
                        replyPreview.style.display = 'none';
                        replyingToMessage = null;
                    })
                    .catch(error => {
                        console.error("Error sending message: ", error);
                        Swal.fire({
                            icon: 'error',
                            title: 'Gagal Mengirim',
                            text: 'Pesan gagal dikirim',
                            confirmButtonColor: '#6c5ce7'
                        });
                    });
            });
    }
}

// Scroll to bottom
function scrollToBottom() {
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
}

// Event listeners
sendBtn.addEventListener('click', sendMessage);
messageInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
    }
});

// Initial scroll to bottom
window.addEventListener('load', scrollToBottom);
</script>
