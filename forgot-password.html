<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lupa Password - Luzuno</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css"> <!-- Sesuaikan dengan file CSS Anda -->
    <!-- SweetAlert2 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <!-- reCAPTCHA -->
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
    <style>
        /* Styling untuk halaman lupa password */
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --accent-color: #6c5ce7;
            --text-color: #2d3436;
            --shadow-color: rgba(0, 0, 0, 0.1);
            --hover-color: #a29bfe;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .forgot-password-container {
            max-width: 400px;
            width: 100%;
            padding: 2rem;
            background: var(--card-bg);
            border-radius: 15px;
            box-shadow: 0 8px 32px var(--shadow-color);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            text-align: center;
        }

        .forgot-password-container:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
        }

        h1 {
            color: var(--accent-color);
            margin-bottom: 1.5rem;
            font-size: 1.8rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: bold;
            color: var(--accent-color);
        }

        .form-group input {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid var(--accent-color);
            border-radius: 8px;
            background: var(--bg-color);
            color: var(--text-color);
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .form-group input:focus {
            border-color: var(--hover-color);
            box-shadow: 0 0 8px rgba(108, 92, 231, 0.3);
            outline: none;
        }

        .btn {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s ease, transform 0.3s ease;
            font-size: 1rem;
            width: 100%;
        }

        .btn:hover {
            background: var(--hover-color);
            transform: translateY(-2px);
        }

        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .back-to-login {
            margin-top: 1.5rem;
            color: var(--text-color);
        }

        .back-to-login a {
            color: var(--accent-color);
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .back-to-login a:hover {
            color: var(--hover-color);
        }

        /* Responsive Design */
        @media (max-width: 480px) {
            .forgot-password-container {
                padding: 1.5rem;
            }

            h1 {
                font-size: 1.5rem;
            }

            .btn {
                padding: 0.7rem;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <div class="forgot-password-container">
        <h1>Lupa Password</h1>
        <form id="forgotPasswordForm">
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" placeholder="Masukkan email Anda" required>
            </div>
            <!-- Widget reCAPTCHA -->
            <div class="g-recaptcha" data-sitekey="6Lc0evsqAAAAAEMVwhbAg5w9mxQdhubX0RoWZeWE"></div>
            <button type="submit" class="btn">
                <i class="fas fa-paper-plane"></i> Kirim Link Reset Password
            </button>
        </form>
        <p class="back-to-login">
            Ingat password Anda? <a href="login.html">Kembali ke Login</a>
        </p>
    </div>

    <!-- SweetAlert2 JS -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module">
        import { getAuth, sendPasswordResetEmail, fetchSignInMethodsForEmail } from "https://www.gstatic.com/firebasejs/9.6.10/firebase-auth.js";
        import { app } from './firebase-config.js';

        const auth = getAuth(app);

        document.getElementById('forgotPasswordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const captchaResponse = grecaptcha.getResponse();

            // Validasi CAPTCHA
            if (!captchaResponse) {
                Swal.fire({
                    icon: 'error',
                    title: 'Gagal!',
                    text: 'Harap selesaikan CAPTCHA.',
                    confirmButtonText: 'OK'
                });
                return;
            }

            try {
                // Periksa apakah email terdaftar
                const methods = await fetchSignInMethodsForEmail(auth, email);
                if (methods.length === 0) {
                    throw new Error('Email tidak terdaftar.');
                }

                // Kirim email reset password
                await sendPasswordResetEmail(auth, email);

                // Tampilkan modal sukses
                Swal.fire({
                    icon: 'success',
                    title: 'Berhasil!',
                    text: 'Link reset password telah dikirim ke email Anda. Silakan periksa email Anda.',
                    confirmButtonText: 'OK'
                }).then(() => {
                    window.location.href = 'login.html'; // Arahkan ke halaman login
                });
            } catch (error) {
                console.error('Error:', error);

                // Tampilkan modal error
                Swal.fire({
                    icon: 'error',
                    title: 'Gagal!',
                    text: error.message,
                    confirmButtonText: 'OK'
                });
            }
        });
    </script>
</body>
</html>
