<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk ke Luzuno</title>
    <style>
        /* Login Page */
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --accent-color: #6c5ce7;
            --text-color: #2d3436;
            --shadow-color: rgba(0, 0, 0, 0.1);
            --hover-color: #a29bfe;
            --google-blue: #4285F4;
            --google-hover-blue: #357ABD;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        /* Navbar */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: var(--card-bg);
            padding: 1rem;
            box-shadow: 0 2px 10px var(--shadow-color);
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav a {
            color: var(--accent-color);
            text-decoration: none;
            font-weight: bold;
            transition: color 0.3s ease;
        }

        nav a:hover {
            color: var(--hover-color);
        }

        .auth-container {
            max-width: 400px;
            width: 100%;
            padding: 2rem;
            background: var(--card-bg);
            border-radius: 15px;
            box-shadow: 0 8px 32px var(--shadow-color);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            text-align: center;
            margin-top: 4rem; /* Beri jarak dari navbar */
        }

        .auth-container:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
        }

        h2 {
            color: var(--accent-color);
            margin-bottom: 1.5rem;
            font-size: 1.8rem;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        input {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid var(--accent-color);
            border-radius: 8px;
            background: var(--bg-color);
            color: var(--text-color);
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        input:focus {
            border-color: var(--hover-color);
            box-shadow: 0 0 8px rgba(108, 92, 231, 0.3);
            outline: none;
        }

        .btn {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 0.8rem;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s ease, transform 0.3s ease;
            font-size: 1rem;
        }

        .btn:hover {
            background: var(--hover-color);
            transform: translateY(-2px);
        }

        .google-btn {
            background: var(--google-blue);
            color: white;
            padding: 0.8rem;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 1rem;
            transition: background 0.3s ease, transform 0.3s ease;
        }

        .google-btn:hover {
            background: var(--google-hover-blue);
            transform: translateY(-2px);
        }

        .google-btn img {
            width: 24px;
            height: 24px;
        }

        p {
            margin-top: 1.5rem;
            color: var(--text-color);
        }

        a {
            color: var(--accent-color);
            text-decoration: none;
            transition: color 0.3s ease;
        }

        a:hover {
            color: var(--hover-color);
        }

        /* Responsive Design */
        @media (max-width: 480px) {
            .auth-container {
                padding: 1.5rem;
            }

            h2 {
                font-size: 1.5rem;
            }

            .btn, .google-btn {
                padding: 0.7rem;
                font-size: 0.9rem;
            }
        }
    </style>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
</head>
<body>
    <!-- Navbar -->
    <nav>
        <a href="index.html">LUZUNO</a>
        <a href="cs.html"><img src="cs.png" width="34"/></a> <!-- Tautan ke halaman CS -->
    </nav>

    <!-- Login Container -->
    <div class="auth-container">
        <h2>Masuk ke Luzuno</h2>
        <form id="loginForm">
            <input type="email" placeholder="Email" required>
            <input type="password" placeholder="Password" required>
            <button type="submit" class="btn">Masuk</button>
        </form>
        
        <div class="google-btn" id="googleLogin">
            <img src="https://img.icons8.com/color/48/000000/google-logo.png" width="24"/>
            Masuk dengan Google
        </div>
        
        <p>Belum punya akun? <a href="signup.html">Daftar disini</a></p>
        <p>Belum menerima email verifikasi? <a href="menu.html">klik disini</a></p>
    </div>

    <!-- SweetAlert2 JS -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module">
        import { 
            getAuth, 
            signInWithEmailAndPassword, 
            GoogleAuthProvider, 
            signInWithPopup 
        } from "https://www.gstatic.com/firebasejs/9.6.10/firebase-auth.js";
        import { app } from './firebase-config.js';

        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        // Fungsi untuk menerjemahkan pesan error Firebase
        const translateFirebaseError = (errorCode) => {
            switch (errorCode) {
                case 'auth/wrong-password':
                    return 'Password yang Anda masukkan salah.';
                case 'auth/user-not-found':
                    return 'Email tidak terdaftar.';
                case 'auth/invalid-email':
                    return 'Format email tidak valid.';
                case 'auth/too-many-requests':
                    return 'Terlalu banyak percobaan login. Silakan coba lagi nanti.';
                case 'auth/user-disabled':
                    return 'Akun ini dinonaktifkan. Silakan hubungi administrator.';
                case 'auth/email-already-in-use':
                    return 'Email sudah digunakan.';
                case 'auth/weak-password':
                    return 'Password terlalu lemah. Gunakan password yang lebih kuat.';
                case 'auth/operation-not-allowed':
                    return 'Metode login ini tidak diizinkan.';
                default:
                    return 'Password atau email Anda salah. Silakan coba lagi.';
            }
        };

        // Handle email/password login
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = e.target[0].value;
            const password = e.target[1].value;

            try {
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                // Periksa apakah email sudah diverifikasi
                if (!user.emailVerified) {
                    Swal.fire({
                        icon: 'warning',
                        title: 'Verifikasi Email',
                        text: 'Email Anda belum diverifikasi. Silakan periksa email Anda untuk verifikasi.',
                        confirmButtonText: 'OK'
                    });
                    return;
                }

                Swal.fire({
                    icon: 'success',
                    title: 'Berhasil!',
                    text: 'Anda berhasil masuk.',
                    confirmButtonText: 'OK'
                }).then(() => {
                    window.location.href = 'index.html';
                });
            } catch (error) {
                // Terjemahkan pesan error
                const errorMessage = translateFirebaseError(error.code);

                Swal.fire({
                    icon: 'error',
                    title: 'Gagal!',
                    text: errorMessage,
                    confirmButtonText: 'OK'
                });
            }
        });

        // Handle Google login
        document.getElementById('googleLogin').addEventListener('click', async () => {
            try {
                const result = await signInWithPopup(auth, provider);
                Swal.fire({
                    icon: 'success',
                    title: 'Berhasil!',
                    text: 'Anda berhasil masuk dengan Google.',
                    confirmButtonText: 'OK'
                }).then(() => {
                    window.location.href = 'index.html';
                });
            } catch (error) {
                Swal.fire({
                    icon: 'error',
                    title: 'Gagal!',
                    text: error.message,
                    confirmButtonText: 'OK'
                });
            }
        });
    </script>
</body>
</html>
