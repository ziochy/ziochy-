<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcard Kanji - Luzuno</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <style>
    :root {
            --sakura-pink: #ffb7c5;
            --sakura-dark: #9f4d60;
            --sakura-bg: #fff4f7;
            --text-color: #4a2a33;
            --card-bg: rgba(255, 255, 255, 0.9);
        }

        [data-theme="dark"] {
            --sakura-pink: #6c5b7b;
            --sakura-dark: #355c7d;
            --sakura-bg: #2d3436;
            --text-color: #dfe6e9;
            --card-bg: rgba(45, 52, 54, 0.9);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Sawarabi Mincho', sans-serif;
            transition: all 0.3s ease;
        }

        body {
            background: var(--sakura-bg);
            color: var(--text-color);
            line-height: 1.7;
            overflow-x: hidden;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .level-selector {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .level-btn {
            padding: 1rem;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            font-family: 'Kiwi Maru', serif;
            background: var(--card-bg);
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            position: relative;
            overflow: hidden;
        }

        .level-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
        }

        .level-btn.n5::before { background: #ff6b6b; }
        .level-btn.n4::before { background: #ff9f43; }
        .level-btn.n3::before { background: #54a0ff; }
        .level-btn.n2::before { background: #2ecc71; }
        .level-btn.n1::before { background: #a55eea; }

        .level-btn.active {
            transform: translateY(-3px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .flashcard-wrapper {
            position: relative;
            max-width: 600px;
            margin: 2rem auto;
            min-height: 400px;
            perspective: 1000px;
        }

        .flashcard {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 0rem;
            box-shadow: 0 8px 30px rgba(0,0,0,0.1);
            position: absolute;
            width: 100%;
            height: 100%;
            cursor: pointer;
            transform-style: preserve-3d;
            transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .flashcard.flipped {
            transform: rotateY(180deg);
        }

        .flashcard.swipe-right {
            transform: translateX(150%) rotate(15deg);
        }

        .flashcard.swipe-left {
            transform: translateX(-150%) rotate(-15deg);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        .card-back {
    transform: rotateY(180deg);
    overflow-y: auto;
    padding: 1rem 1.5rem 1rem 3rem; /* Top Right Bottom Left - lebih ke kanan */
    font-size: 0.9rem;
    text-align: left; /* Pastikan rata kiri */
    margin-left: 5px; /* Geser seluruh konten ke kanan */
}

/* Untuk elemen di dalam card-back */
.card-back .details {
    margin-left: 10px; /* Geser konten detail lebih ke kanan */
}

/* Geser contoh kalimat lebih ke kanan */
.card-back .example {
    margin-left: 5px;
    padding-left: 5px;
}

/* Geser stroke info ke kanan bawah */
.card-back .strokes {
    right: 20px; /* Posisikan lebih dari kanan */
    left: auto; /* Pastikan tidak ada left positioning */
}
        
.kanji {
    font-size: 5rem; /* Perkecil ukuran kanji */
    margin: 0.5rem 0; /* Kurangi margin */
}

.details {
    font-size: 0.9rem; /* Ukuran font lebih kecil */
    width: 95%; /* Lebar dikurangi */
    margin: 0 auto; /* Pusatkan */
}

.reading-section, .example {
    padding: 0.3rem; /* Padding lebih kecil */
    margin: 0.3rem 0; /* Margin lebih kecil */
}

.strokes {
    font-size: 0.8rem; /* Ukuran lebih kecil */
    bottom: 0.5rem; /* Posisi lebih atas */
    right: 0.5rem; /* Posisi lebih kiri */
}

        .reading-title {
            font-weight: bold;
            margin-bottom: 0.3rem;
            color: var(--sakura-dark);
        }

        .example {
            margin: 0.5rem 0;
            padding: 0.5rem;
            background: rgba(0,0,0,0.05);
            border-radius: 8px;
            font-style: italic;
        }

        

        .progress-container {
            height: 8px;
            background: rgba(0,0,0,0.1);
            border-radius: 4px;
            margin: 2rem 0;
        }

        .progress-bar {
            height: 100%;
            background: var(--sakura-pink);
            border-radius: 4px;
            transition: width 0.5s ease;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-top: 2rem;
        }

        .control-btn {
            padding: 1rem 2rem;
            border: none;
            border-radius: 25px;
            background: var(--sakura-dark);
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .hint-text {
            text-align: center;
            margin: 2rem 0;
            opacity: 0.7;
        }

        
    </style>
</head>
<body>
   <!-- Elemen Audio -->

            progress[currentLevel] = {

            // Jika ada progres untuk level saat ini, gunakan
            if (progress[currentLevel]) {
                currentCards = [...progress[currentLevel].currentCards];

            updateProgress();
            showNextCard();
        }

        function loadDeckForLevel(level) {
            // Simpan progres level sebelumnya
            saveProgress();
            
            // Load progres dari localStorage
            const progress = JSON.parse(localStorage.getItem('kanjiProgress')) || {};
            
            currentLevel = level;
            
            // Jika ada progres untuk level ini, gunakan
            if (progress[level]) {
                currentCards = [...progress[level].currentCards];
                knownCards = [...progress[level].knownCards];

                currentCards = [...kanjiData[level]];

            function createFlashcard(kanji) {
    const card = document.createElement('div');
    card.className = 'flashcard';
    
    // Format bacaan kunyomi dan onyomi dengan pemisah yang jelas
    const formatReadings = (readings) => {
        return readings.split(',').map(r => r.trim()).join(', ');
    };

    // Format contoh lengkap dengan arti
    let examplesHTML = kanji.examples.map(ex => {
        const [japanese, meaning] = ex.split(' - ');
        return `<div class="example">
            <span class="japanese-ex">${japanese}</span>
            <span class="meaning"> - ${meaning}</span>
        </div>`;
    }).join('');
    
    card.innerHTML = `
        <div class="card-front">
            <div class="kanji">${kanji.kanji}</div>
            <div class="strokes">${kanji.strokes}✍️ | JLPT ${kanji.jlpt}</div>
        </div>
        <div class="card-back">
            <div class="details">
                <div class="reading-section">
                    <span class="reading-title">音読み (Onyomi):</span> 
                    <span class="reading-value">${formatReadings(kanji.onyomi)}</span>
                </div>
                <div class="reading-section">
                    <span class="reading-title">訓読み (Kunyomi):</span> 
                    <span class="reading-value">${formatReadings(kanji.kunyomi)}</span>
                </div>
                <div class="reading-section">
                    <span class="reading-title">Arti:</span> 
                    <span class="meaning-value">${kanji.meaning}</span>
                </div>
                <div class="examples-title">Contoh Penggunaan:</div>
                <div class="examples-container">
                    ${examplesHTML}
                </div>
            </div>
            <div class="strokes">${kanji.strokes}✍️ | JLPT ${kanji.jlpt}</div>
        </div>
    `;
    return card;
}
            

  

        function handleSwipe(direction) {
            const currentCard = document.querySelector('.flashcard');
            currentCard.classList.add(`swipe-${direction}`);
            
            direction === 'left' ? audio.swipeLeft.play() : audio.swipeRight.play();

            setTimeout(() => {
                if (direction === 'left') {
                    knownCards.push(currentCards.shift());
                } else {
                    currentCards.push(currentCards.shift());
                }
                updateProgress();
                showNextCard();
                saveProgress();
            }, 600);
        }

        function showNextCard() {
            const wrapper = document.getElementById('flashcardWrapper');
            wrapper.innerHTML = '';
            
            if (currentCards.length > 0) {
                const card = createFlashcard(currentCards[0]);
                card.addEventListener('click', () => {
                    card.classList.toggle('flipped');
                    audio.flip.play();
                });
                addSwipeListeners(card);
                wrapper.appendChild(card);
            } else {
                audio.complete.play();
                wrapper.innerHTML = `<div class="flashcard" style="display: flex; align-items: center; justify-content: center;">
                    <h2>🎉 Sudah selesai! 🎉</h2>
                </div>`;
            }
        }

        function addSwipeListeners(element) {
            element.addEventListener('mousedown', startDrag);
            element.addEventListener('touchstart', startDrag);
            element.addEventListener('mousemove', duringDrag);
            element.addEventListener('touchmove', duringDrag);
            element.addEventListener('mouseup', endDrag);
            element.addEventListener('touchend', endDrag);
        }

        function startDrag(e) {
            isDragging = true;
            startX = e.type === 'touchstart' ? e.touches[0].clientX : e.clientX;
            currentX = startX;
        }

        function duringDrag(e) {
            if (!isDragging) return;
            const x = e.type === 'touchmove' ? e.touches[0].clientX : e.clientX;
            const delta = x - currentX;
            currentX = x;
            
            const card = document.querySelector('.flashcard');
            const rotate = delta * 0.1;
            card.style.transform = `translateX(${delta}px) rotate(${rotate}deg)`;
        }

        function endDrag(e) {
            if (!isDragging) return;
            isDragging = false;
            
            const card = document.querySelector('.flashcard');
            const delta = currentX - startX;
            
            if (Math.abs(delta) > 100) {
                handleSwipe(delta > 0 ? 'right' : 'left');
            } else {
                card.style.transform = '';
            }
        }

        function updateProgress() {
            const total = kanjiData[currentLevel].length;
            const known = knownCards.length;
            const progress = (known / total) * 100;
            document.getElementById('progressBar').style.width = `${progress}%`;
        }

        // Toggle tema gelap/terang
        function toggleTheme() {
            const html = document.documentElement;
            const currentTheme = html.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            html.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
        }

        // Event Listeners
        document.querySelectorAll('.level-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                audio.levelChange.play();
                document.querySelector('.level-btn.active').classList.remove('active');
                this.classList.add('active');
                loadDeckForLevel(this.dataset.level);
            });
        });

        document.getElementById('resetBtn').addEventListener('click', resetCurrentLevel);

        document.getElementById('themeBtn').addEventListener('click', toggleTheme);

        // Muat tema yang disimpan
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);

        // Muat progres saat halaman dimuat
        loadProgress();
    </script>
</body>
