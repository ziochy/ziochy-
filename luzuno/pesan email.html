<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pesan Pemberitahuan</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.10/firebase-app.js";
    import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.6.10/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA7BJUBNxvlqHUJ9u3KRcpPZDcMCbd9Qk0",
      authDomain: "luzuno-web.firebaseapp.com",
      projectId: "luzuno-web",
      storageBucket: "luzuno-web.firebasestorage.app",
      messagingSenderId: "728661935868",
      appId: "1:728661935868:web:859ebff3a63b1210acb979"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    // Elemen DOM
    const pesanList = document.getElementById('pesanList');
    const statusDiv = document.getElementById('status');
    const refreshBtn = document.getElementById('refreshBtn');
    const tabAll = document.getElementById('tabAll');
    const tabPersonal = document.getElementById('tabPersonal');
    const emptyState = document.getElementById('emptyState');
    const loadingIndicator = document.getElementById('loading');

    // Variabel state
    let currentUserId = null;
    let notifications = [];
    let activeTab = 'all';

    // Fungsi untuk memformat waktu
    function formatWaktu(tanggal) {
      if (!tanggal) return 'Waktu tidak diketahui';
      
      const now = new Date();
      const dateObj = tanggal?.toDate ? tanggal.toDate() : new Date(tanggal);
      
      if (isNaN(dateObj.getTime())) return 'Waktu tidak valid';
      
      const diffMs = now - dateObj;
      const diffMins = Math.round(diffMs / (1000 * 60));
      
      if (diffMins < 1) return 'Baru saja';
      if (diffMins < 60) return `${diffMins} menit yang lalu`;
      if (diffMins < 1440) return `${Math.floor(diffMins / 60)} jam yang lalu`;
      
      return dateObj.toLocaleDateString('id-ID', {
        day: 'numeric',
        month: 'short',
        year: 'numeric',
        hour: '2-digit',
        minute: '2-digit'
      });
    }

    // Fungsi untuk memfilter notifikasi
    function filterNotifications() {
      if (activeTab === 'all') {
        return notifications.filter(notif => notif.target === 'all');
      } else {
        return notifications.filter(notif => 
          notif.target === 'user' && notif.userId === currentUserId
        );
      }
    }

    // Fungsi untuk render notifikasi
    function renderPesan() {
      const filteredNotif = filterNotifications();
      
      if (filteredNotif.length === 0) {
        emptyState.style.display = 'block';
        pesanList.innerHTML = '';
        return;
      }
      
      emptyState.style.display = 'none';
      pesanList.innerHTML = '';
      
      filteredNotif.forEach((item) => {
        const div = document.createElement('div');
        div.className = "pesanCard";
        const waktu = item.waktu;
        
        let icon = "fa-info-circle";
        let badgeClass = "info";
        if (item.jenis === "penting") {
          icon = "fa-exclamation-circle";
          badgeClass = "penting";
        } else if (item.jenis === "update") {
          icon = "fa-sync-alt";
          badgeClass = "update";
        } else if (item.jenis === "event") {
          icon = "fa-calendar-alt";
          badgeClass = "event";
        }
        
        const targetBadge = item.target === 'user' ? 
          '<span class="target-badge personal"><i class="fas fa-user"></i> Pribadi</span>' : 
          '<span class="target-badge global"><i class="fas fa-users"></i> Global</span>';
        
        div.innerHTML = `
          <div class="pesanHeader">
            <div class="badge-container">
              <i class="fas ${icon} ${badgeClass}"></i>
              ${targetBadge}
            </div>
            <span class="waktu">${formatWaktu(waktu)}</span>
          </div>
          <div class="pesanContent">
            <p>${item.pesan}</p>
          </div>
        `;
        pesanList.appendChild(div);
      });
    }

    // Fungsi untuk memuat notifikasi
    async function loadPesanDariServer() {
      statusDiv.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Memuat pesan terbaru...';
      refreshBtn.style.display = 'flex';
      loadingIndicator.style.display = 'block';
      
      try {
        const q = query(collection(db, "pemberitahuan"), orderBy("waktu", "desc"));
        const querySnapshot = await getDocs(q);
        notifications = [];
        
        querySnapshot.forEach((doc) => {
          notifications.push({
            id: doc.id,
            ...doc.data()
          });
        });

        localStorage.setItem("cachePemberitahuan", JSON.stringify(notifications));
        localStorage.setItem("lastUpdateTime", Date.now());
        
        renderPesan();
        statusDiv.innerHTML = '<i class="fas fa-check-circle"></i> Terakhir diperbarui: ' + new Date().toLocaleTimeString();
      } catch (error) {
        console.error(error);
        statusDiv.innerHTML = '<i class="fas fa-exclamation-circle"></i> Gagal memuat pesan terbaru';
        loadFromCache();
      } finally {
        refreshBtn.style.display = 'none';
        loadingIndicator.style.display = 'none';
      }
    }

    // Fungsi untuk memuat dari cache
    function loadFromCache() {
      const cache = localStorage.getItem("cachePemberitahuan");
      const lastUpdate = localStorage.getItem("lastUpdateTime");
      
      if (cache) {
        try {
          notifications = JSON.parse(cache);
          
          if (lastUpdate) {
            const lastUpdateDate = new Date(parseInt(lastUpdate));
            statusDiv.innerHTML = `<i class="fas fa-database"></i> Data cache ${formatWaktu(lastUpdateDate)}`;
          } else {
            statusDiv.innerHTML = '<i class="fas fa-database"></i> Memuat dari cache';
          }
          
          renderPesan();
        } catch {
          console.error("Cache korup.");
          statusDiv.innerHTML = '<i class="fas fa-exclamation-triangle"></i> Cache error';
          showEmptyState();
        }
      } else {
        showEmptyState();
      }
    }

    // Fungsi untuk menampilkan empty state
    function showEmptyState() {
      emptyState.style.display = 'block';
      pesanList.innerHTML = '';
    }

    // Event listener untuk tab
    tabAll.addEventListener('click', () => {
      activeTab = 'all';
      tabAll.classList.add('active');
      tabPersonal.classList.remove('active');
      renderPesan();
    });

    tabPersonal.addEventListener('click', () => {
      if (!currentUserId) {
        statusDiv.innerHTML = '<i class="fas fa-exclamation-circle"></i> Harus login untuk melihat notifikasi pribadi';
        return;
      }
      activeTab = 'personal';
      tabAll.classList.remove('active');
      tabPersonal.classList.add('active');
      renderPesan();
    });

    // Event listener untuk tombol refresh
    refreshBtn.addEventListener('click', loadPesanDariServer);

    // Inisialisasi saat pertama load
    window.addEventListener('load', () => {
      refreshBtn.style.display = 'none'; // Sembunyikan tombol refresh awal
      
      onAuthStateChanged(auth, (user) => {
        if (user) {
          currentUserId = user.uid;
          tabPersonal.style.display = 'inline-block';
        } else {
          currentUserId = null;
          tabPersonal.style.display = 'none';
        }
        
        loadFromCache();
        loadPesanDariServer();
      });
    });

  </script>

  <style>
    :root {
      --primary-color: #6c5ce7;
      --primary-dark: #5a4fd4;
      --secondary-color: #a29bfe;
      --accent-color: #fd79a8;
      --text-color: #2d3436;
      --bg-color: #f4f7f6;
      --card-bg: #ffffff;
      --shadow-color: rgba(0, 0, 0, 0.1);
      --success-color: #00b894;
      --warning-color: #fdcb6e;
      --error-color: #d63031;
      --info-color: #0984e3;
      --penting-color: #e84393;
      --event-color: #8c7ae6;
      --personal-color: #00cec9;
      --global-color: #74b9ff;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: var(--bg-color);
      margin: 0;
      padding: 0;
      color: var(--text-color);
      min-height: 100vh;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 1px solid rgba(0,0,0,0.1);
      position: relative;
    }

    h1 {
      margin: 0;
      font-size: 1.5rem;
      color: var(--primary-color);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    h1 i {
      font-size: 1.2rem;
    }

    #status {
      font-size: 0.8rem;
      color: #666;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 5px;
      min-height: 20px;
    }

    #status i {
      font-size: 1rem;
    }

    .refresh-btn {
      background: var(--primary-color);
      color: white;
      border: none;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      display: none; /* Awalnya disembunyikan */
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s ease;
      position: absolute;
      right: 0;
    }

    .refresh-btn:hover {
      background: var(--primary-dark);
      transform: rotate(180deg);
    }

    .refresh-btn:active {
      transform: scale(0.95) rotate(180deg);
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      border-bottom: 2px solid var(--light-gray);
    }

    .tab {
      padding: 8px 16px;
      border-radius: 8px 8px 0 0;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s;
      border-bottom: 3px solid transparent;
    }

    .tab.active {
      background: rgba(108, 92, 231, 0.1);
      color: var(--primary-color);
      border-bottom-color: var(--primary-color);
    }

    .tab i {
      margin-right: 5px;
    }

    #loading {
      display: none;
      text-align: center;
      padding: 20px;
    }

    .spinner {
      width: 24px;
      height: 24px;
      border: 3px solid rgba(108, 92, 231, 0.2);
      border-top-color: var(--primary-color);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 10px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    #pesanList {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .pesanCard {
      background: var(--card-bg);
      padding: 18px;
      border-radius: 12px;
      box-shadow: 0 4px 12px var(--shadow-color);
      transition: all 0.3s ease;
      border-left: 4px solid var(--primary-color);
    }

    .pesanCard:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.15);
    }

    .pesanHeader {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .badge-container {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .pesanHeader i {
      font-size: 1.2rem;
    }

    .pesanHeader i.info {
      color: var(--info-color);
    }

    .pesanHeader i.penting {
      color: var(--penting-color);
    }

    .pesanHeader i.update {
      color: var(--warning-color);
    }

    .pesanHeader i.event {
      color: var(--event-color);
    }

    .target-badge {
      font-size: 0.7rem;
      padding: 3px 8px;
      border-radius: 10px;
      font-weight: 500;
    }

    .target-badge.personal {
      background-color: rgba(0, 206, 201, 0.1);
      color: var(--personal-color);
      border: 1px solid rgba(0, 206, 201, 0.3);
    }

    .target-badge.global {
      background-color: rgba(116, 185, 255, 0.1);
      color: var(--global-color);
      border: 1px solid rgba(116, 185, 255, 0.3);
    }

    .waktu {
      font-size: 0.75rem;
      color: #777;
    }

    .pesanContent p {
      margin: 0;
      font-size: 0.95rem;
      line-height: 1.6;
    }

    #emptyState {
      text-align: center;
      padding: 40px 20px;
      color: #777;
      display: none;
    }

    #emptyState i {
      font-size: 3rem;
      margin-bottom: 15px;
      opacity: 0.5;
      color: var(--primary-color);
    }

    #emptyState p {
      margin: 0;
      font-size: 1rem;
    }

    @media (max-width: 480px) {
      .container {
        padding: 15px;
      }
      
      h1 {
        font-size: 1.3rem;
      }
      
      .pesanCard {
        padding: 15px;
      }
      
      .tab {
        padding: 6px 12px;
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1><i class="fas fa-bell"></i> Pemberitahuan</h1>
      <button id="refreshBtn" class="refresh-btn" title="Perbarui">
        <i class="fas fa-sync-alt"></i>
      </button>
    </header>
    
    <div id="status">Memuat...</div>
    
    <div class="tabs">
      <div id="tabAll" class="tab active"><i class="fas fa-globe"></i> Semua</div>
      <div id="tabPersonal" class="tab" style="display:none;"><i class="fas fa-user"></i> Pribadi</div>
    </div>
    
    <div id="loading">
      <div class="spinner"></div>
      <p>Memuat pemberitahuan...</p>
    </div>
    
    <div id="emptyState">
      <i class="far fa-bell"></i>
      <p>Tidak ada pemberitahuan</p>
    </div>
    
    <div id="pesanList"></div>
  </div>
</body>
</html>
