<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifikasi Email - Luzuno</title>
    <style>
        /* Verifikasi Email Page */
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --accent-color: #6c5ce7;
            --text-color: #2d3436;
            --shadow-color: rgba(0, 0, 0, 0.1);
            --hover-color: #a29bfe;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .verify-container {
            max-width: 400px;
            width: 100%;
            padding: 2rem;
            background: var(--card-bg);
            border-radius: 15px;
            box-shadow: 0 8px 32px var(--shadow-color);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            text-align: center;
        }

        .verify-container:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
        }

        h2 {
            color: var(--accent-color);
            margin-bottom: 1.5rem;
            font-size: 1.8rem;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        input {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid var(--accent-color);
            border-radius: 8px;
            background: var(--bg-color);
            color: var(--text-color);
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        input:focus {
            border-color: var(--hover-color);
            box-shadow: 0 0 8px rgba(108, 92, 231, 0.3);
            outline: none;
        }

        .btn {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 0.8rem;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s ease, transform 0.3s ease;
            font-size: 1rem;
        }

        .btn:hover {
            background: var(--hover-color);
            transform: translateY(-2px);
        }

        p {
            margin-top: 1.5rem;
            color: var(--text-color);
        }

        a {
            color: var(--accent-color);
            text-decoration: none;
            transition: color 0.3s ease;
        }

        a:hover {
            color: var(--hover-color);
        }

        /* Responsive Design */
        @media (max-width: 480px) {
            .verify-container {
                padding: 1.5rem;
            }

            h2 {
                font-size: 1.5rem;
            }

            .btn {
                padding: 0.7rem;
                font-size: 0.9rem;
            }
        }
    </style>
    <!-- SweetAlert2 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
</head>
<body>
    <div class="verify-container">
        <h2>Verifikasi Email</h2>
        <form id="loginForm">
            <input type="email" placeholder="Email" required>
            <input type="password" placeholder="Password" required>
            <button type="submit" class="btn">Masuk & Verifikasi</button>
        </form>
        <p>Sudah verifikasi akun? <a href="login.html">Masuk disini</a></p>
    </div>

    <!-- SweetAlert2 JS -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module">
        import { 
            getAuth, 
            signInWithEmailAndPassword,
            sendEmailVerification,
            onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/9.6.10/firebase-auth.js";
        import { app } from './firebase-config.js';

        const auth = getAuth(app);

        // Handle login dan verifikasi email
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = e.target[0].value;
            const password = e.target[1].value;

            try {
                // Login pengguna
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                // Periksa apakah email sudah diverifikasi
                if (!user.emailVerified) {
                    // Kirim email verifikasi
                    await sendEmailVerification(user);
                    Swal.fire({
                        icon: 'success',
                        title: 'Berhasil!',
                        text: 'Email verifikasi telah dikirim. Silakan periksa email Anda.',
                        confirmButtonText: 'OK'
                    }).then(() => {
                        // Logout pengguna setelah mengirim email verifikasi
                        auth.signOut();
                        window.location.href = 'login.html'; // Arahkan ke halaman login
                    });
                } else {
                    Swal.fire({
                        icon: 'info',
                        title: 'Email Sudah Diverifikasi',
                        text: 'Email Anda sudah diverifikasi. Silakan login kembali.',
                        confirmButtonText: 'OK'
                    }).then(() => {
                        // Logout pengguna dan arahkan ke halaman login
                        auth.signOut();
                        window.location.href = 'login.html';
                    });
                }
            } catch (error) {
                Swal.fire({
                    icon: 'error',
                    title: 'Gagal!',
                    text: error.message,
                    confirmButtonText: 'OK'
                });
            }
        });

        // Pantau status login pengguna
        onAuthStateChanged(auth, (user) => {
            if (user && user.emailVerified) {
                // Jika pengguna sudah login dan email sudah diverifikasi, arahkan ke halaman login
                Swal.fire({
                    icon: 'info',
                    title: 'Email Sudah Diverifikasi',
                    text: 'Email Anda sudah diverifikasi. Silakan login kembali.',
                    confirmButtonText: 'OK'
                }).then(() => {
                    auth.signOut();
                    window.location.href = 'login.html';
                });
            }
        });
    </script>
</body>
</html>
